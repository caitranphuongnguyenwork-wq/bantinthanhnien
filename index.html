<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio Link</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            /* Đảm bảo bạn đã upload file thiết kế từ Canva lên GitHub và đổi tên thành anh-nen.png */
            background-image: url('anh-nen.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Giúp hộp nội dung nằm giữa màn hình */
            min-height: 100vh;
            color: #333;
        }

        .dynamic-box {
            background: rgba(255, 255, 255, 0.92); /* Làm nền trắng đục hơn một chút để chữ dễ đọc trên nền Canva */
            padding: 25px 35px;
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 90%;
            width: 420px;
        }

        #time-display {
            font-size: 2.8em;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        #date-display {
            font-size: 1.1em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            display: inline-block;
        }

        #quote-display {
            font-size: 1.1em;
            font-style: italic;
            color: #555;
            line-height: 1.6;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="dynamic-box">
        <div id="time-display">00:00:00</div>
        <div id="date-display">Đang tải ngày tháng...</div>
        <div id="quote-display">Đang tải câu nói động lực...</div>
    </div>

    <script>
        // Hàm cập nhật đồng hồ (chạy liên tục mỗi giây)
        function updateClock() {
            const d = new Date();
            let hours = d.getHours();
            let minutes = d.getMinutes();
            let seconds = d.getSeconds();
            
            // Thêm số 0 đằng trước nếu số nhỏ hơn 10 để form đồng hồ luôn đẹp (ví dụ: 09:05:02)
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('time-display').innerText = `${hours}:${minutes}:${seconds}`;
        }

        // Hàm cập nhật ngày tháng và câu nói (chỉ chạy 1 lần khi load trang)
        function updateDateAndQuote() {
            const d = new Date();
            const daysOfWeek = ["Chủ Nhật", "Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy"];
            
            const dayName = daysOfWeek[d.getDay()];
            const date = d.getDate();
            const month = d.getMonth() + 1;
            const year = d.getFullYear();

            document.getElementById('date-display').innerText = `${dayName}, ngày ${date}/${month}/${year}`;

            // Danh sách câu nói động lực thay đổi theo ngày
            const positiveQuotes = [
                "Cuối tuần thư giãn trọn vẹn nhé! Nạp lại năng lượng để sẵn sàng cho những mục tiêu phía trước. 🌿",
                "Khởi đầu tuần mới đầy hứng khởi! Từng bước nhỏ kiên trì sẽ dẫn đến kết quả lớn, dù là trên giảng đường hay hành trình rèn luyện bản thân. 🚀",
                "Mỗi đứa trẻ là một thế giới riêng. Áp dụng những nguyên lý tâm lý học vào thực tiễn sẽ giúp tạo ra những giờ học tuyệt vời! 🌻",
                "Duy trì thói quen ăn uống thanh đạm, ít dầu mỡ và vận động đều đặn. Sức khỏe tốt là nền tảng vững chắc nhất cho mọi thành công! 🥗💪",
                "Keep pushing forward! Mỗi giờ rèn luyện ngoại ngữ hôm nay là một bước tiến gần hơn đến con số 900+ vững chắc. 🎯",
                "Tri thức giáo dục tiểu học không chỉ nằm trong sách vở mà còn ở sự thấu hiểu. Chúc bạn có những giờ học phương pháp sư phạm thật hiệu quả! 📚",
                "Một tuần nỗ lực đã qua. Hãy tự thưởng cho mình một buổi tối thảnh thơi và nhìn lại những tiến bộ của bản thân nhé! ✨"
            ];

            document.getElementById('quote-display').innerText = `"${positiveQuotes[d.getDay()]}"`;
        }

        // Kích hoạt hàm ngay khi mở web
        updateDateAndQuote();
        updateClock();
        
        // Cài đặt để đồng hồ nhảy số mỗi 1000 mili-giây (1 giây)
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
